name: Daily S&P 500 Swing Scan

on:
  schedule:
    # 13:00 UTC = 14:00 UK BST (Apr–Oct) / 13:00 UK GMT (Nov–Mar).
    - cron: "0 13 * * 1-5"
  workflow_dispatch:           # allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Log new trades
        run: python trade_logger.py
        continue-on-error: true

      - name: Update trade outcomes
        run: python outcome_tracker.py
        continue-on-error: true

      - name: Generate analytics
        run: python analytics.py
        continue-on-error: true

      - name: Send push notification
        run: python notifier.py
        continue-on-error: true

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash generated files before reset
          cp results.json /tmp/results_new.json
          cp trade_history.json /tmp/trade_history_new.json 2>/dev/null || true
          cp analytics.json     /tmp/analytics_new.json     2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          # Restore generated files
          cp /tmp/results_new.json results.json
          [ -f /tmp/trade_history_new.json ] && cp /tmp/trade_history_new.json trade_history.json
          [ -f /tmp/analytics_new.json ]     && cp /tmp/analytics_new.json     analytics.json

          git add results.json trade_history.json analytics.json
          git diff --staged --quiet || git commit -m "chore: scan + analytics $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
