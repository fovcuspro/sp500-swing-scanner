name: Daily S&P 500 Swing Scan

on:
  schedule:
    # 13:00 UTC = 14:00 UK BST (Apr–Oct) / 13:00 UK GMT (Nov–Mar).
    - cron: "0 13 * * 1-5"
  workflow_dispatch:           # allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Shared group with daily_portfolio.yml — both reset-hard and push to main,
# so they must queue rather than race.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Health check
        run: python healthcheck.py
        continue-on-error: true

      - name: Run scanner
        run: python scanner.py

      - name: Log new trades
        run: python trade_logger.py
        continue-on-error: true

      - name: Update trade outcomes
        run: python outcome_tracker.py
        continue-on-error: true

      - name: Generate analytics
        run: python analytics.py
        continue-on-error: true

      - name: Send push notification
        run: python notifier.py
        continue-on-error: true

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILES="results.json prev_results.json trade_history.json analytics.json health.json sectors.json"

          # Stash generated files before reset
          mkdir -p /tmp/gen
          for f in $FILES; do
            if [ -f "$f" ]; then cp "$f" /tmp/gen/; fi
          done

          attempt() {
            git fetch origin main
            git reset --hard origin/main
            for f in $FILES; do
              if [ -f "/tmp/gen/$f" ]; then cp "/tmp/gen/$f" "$f"; fi
            done
            git add $FILES
            if git diff --staged --quiet; then return 0; fi
            git commit -m "chore: scan + analytics $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          }

          for i in 1 2 3; do
            if attempt; then exit 0; fi
            echo "Push rejected (attempt $i) — retrying after refetch…"
            sleep 5
          done
          echo "Failed to push results after 3 attempts" >&2
          exit 1

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -H "Title: Scanner workflow FAILED" -H "Priority: high" \
            -d "Daily scan workflow failed on $(date -u +'%Y-%m-%d %H:%M UTC'). Check GitHub Actions logs." \
            https://ntfy.sh/swing13cat
