name: Daily S&P 500 Swing Scan

on:
  schedule:
    # 17:00 UTC = 18:00 UK BST (Apr–Oct). Runs 1 hour early in GMT (Nov–Mar)
    # but avoids the double-run caused by maintaining two cron entries.
    - cron: "0 17 * * 1-5"
  workflow_dispatch:           # allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write          # needed to push results.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Send push notification
        run: python notifier.py
        continue-on-error: true

      - name: Commit and push results.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json scanner.log
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "chore: scan results $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
