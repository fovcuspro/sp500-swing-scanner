<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --black:   #0a0a0a;
    --surface: #111111;
    --card:    #161616;
    --border:  #242424;
    --muted:   #3a3a3a;
    --text:    #e8e4dc;
    --sub:     #8a8478;
    --gold:    #c9a84c;
    --gold2:   #e8c97a;
    --green:   #4caf7d;
    --red:     #e05555;
    --amber:   #e8a245;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ── Nav Bar ── */
  .nav-bar {
    background: var(--black);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 16px;
  }
  .nav-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--sub);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .nav-tab svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2px;
  }

  .brand {
    font-family: 'Instrument Serif', serif;
    font-size: 18px;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  .brand span {
    font-style: normal;
    color: var(--sub);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    display: block;
    margin-top: 1px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .scan-time {
    font-size: 10px;
    color: var(--sub);
    text-align: right;
    letter-spacing: 0.05em;
  }

  /* ── Summary Strip ── */
  .summary-strip {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .stat + .stat {
    padding-left: 16px;
    border-left: 1px solid var(--border);
    margin-left: 16px;
  }

  .stat-label {
    font-size: 9px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.gold { color: var(--gold2); }

  .stat-sub {
    font-size: 10px;
    color: var(--sub);
  }

  /* ── Alert banner ── */
  .alert-banner {
    margin: 12px 16px 0;
    background: rgba(224, 85, 85, 0.08);
    border: 1px solid rgba(224, 85, 85, 0.3);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .alert-dot {
    width: 6px; height: 6px;
    background: var(--red);
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.8); }
  }

  /* ── Section header ── */
  .section-header {
    padding: 16px 20px 8px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--sub);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .pos-count {
    background: var(--muted);
    color: var(--sub);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* ── Position Cards ── */
  .positions {
    padding: 0 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
    cursor: pointer;
  }

  .card:active { border-color: var(--gold); }

  .card.signal-STOP_HIT    { border-color: rgba(224,85,85,0.5); }
  .card.signal-TARGET_HIT  { border-color: rgba(76,175,125,0.5); }
  .card.signal-UNDER_PRESSURE { border-color: rgba(232,162,69,0.4); }
  .card.signal-RUNNING     { border-left: 3px solid var(--green); }

  .card-main {
    padding: 14px 16px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0 12px;
    align-items: center;
  }

  /* Signal dot */
  .signal-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .signal-dot.STOP_HIT      { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .signal-dot.TARGET_HIT    { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .signal-dot.UNDER_PRESSURE { background: var(--amber); }
  .signal-dot.RUNNING       { background: var(--green); }
  .signal-dot.ON_TRACK      { background: var(--muted); }

  .card-ticker-block { min-width: 0; }

  .card-ticker {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text);
    font-family: 'DM Mono', monospace;
  }

  .card-meta {
    font-size: 10px;
    color: var(--sub);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-price-block {
    text-align: right;
    flex-shrink: 0;
  }

  .card-price {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .card-day-change {
    font-size: 11px;
    margin-top: 2px;
  }

  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--sub); }

  /* Expanded detail */
  .card-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
  }

  .card.expanded .card-detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }

  .detail-item {}

  .detail-label {
    font-size: 9px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }

  .detail-value {
    font-size: 13px;
    color: var(--text);
  }

  /* Progress bar: entry → current → target */
  .progress-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .progress-label {
    font-size: 9px;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .progress-track {
    position: relative;
    height: 4px;
    background: var(--muted);
    border-radius: 2px;
    margin-bottom: 6px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), var(--green));
    transition: width 0.4s ease;
  }

  .progress-fill.neg-fill {
    background: linear-gradient(90deg, var(--red), var(--amber));
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--sub);
  }

  /* Signal pill */
  .signal-pill {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 4px;
    margin-top: 10px;
  }

  .pill-STOP_HIT      { background: rgba(224,85,85,0.15); color: var(--red); border: 1px solid rgba(224,85,85,0.3); }
  .pill-TARGET_HIT    { background: rgba(76,175,125,0.15); color: var(--green); border: 1px solid rgba(76,175,125,0.3); }
  .pill-UNDER_PRESSURE{ background: rgba(232,162,69,0.15); color: var(--amber); border: 1px solid rgba(232,162,69,0.3); }
  .pill-RUNNING       { background: rgba(76,175,125,0.1);  color: var(--green); border: 1px solid rgba(76,175,125,0.2); }
  .pill-ON_TRACK      { background: rgba(138,132,120,0.1); color: var(--sub);   border: 1px solid var(--border); }

  /* Notes */
  .card-notes {
    margin-top: 10px;
    font-size: 11px;
    color: var(--sub);
    font-style: italic;
    line-height: 1.5;
    padding: 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    border-left: 2px solid var(--muted);
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 30px;
    color: var(--sub);
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-title {
    font-family: 'Instrument Serif', serif;
    font-size: 20px;
    font-style: italic;
    color: var(--text);
    margin-bottom: 8px;
  }

  .empty-sub {
    font-size: 11px;
    line-height: 1.6;
    max-width: 240px;
    margin: 0 auto;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--sub);
  }

  .loading-bar {
    width: 120px;
    height: 2px;
    background: var(--border);
    margin: 16px auto 0;
    border-radius: 1px;
    overflow: hidden;
  }

  .loading-bar::after {
    content: '';
    display: block;
    height: 100%;
    width: 40%;
    background: var(--gold);
    border-radius: 1px;
    animation: slide 1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* Error */
  .error-state {
    margin: 24px 16px;
    padding: 16px;
    background: rgba(224,85,85,0.06);
    border: 1px solid rgba(224,85,85,0.2);
    border-radius: 8px;
    color: var(--red);
    font-size: 12px;
    line-height: 1.6;
  }

  /* Footer */
  .footer {
    padding: 16px 20px 8px;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    letter-spacing: 0.06em;
  }

  /* Stagger animation */
  .card {
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.3s ease forwards;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }
  .card:nth-child(7) { animation-delay: 0.35s; }
  .card:nth-child(8) { animation-delay: 0.40s; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="nav-bar">
  <a class="nav-tab" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Scanner
  </a>
  <a class="nav-tab active" href="portfolio.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Portfolio
  </a>
</div>

<div class="header">
  <div class="header-top">
    <div class="brand">
      Portfolio
      <span>Swing Tracker</span>
    </div>
    <div class="scan-time" id="scanTime">—</div>
  </div>
</div>

<div id="summaryStrip" style="display:none" class="summary-strip">
  <div class="stat">
    <div class="stat-label">Total P&L</div>
    <div class="stat-value" id="totalPnl">—</div>
    <div class="stat-sub" id="totalPnlPct">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Day P&L</div>
    <div class="stat-value" id="dayPnl">—</div>
    <div class="stat-sub" id="posCount">— positions</div>
  </div>
  <div class="stat">
    <div class="stat-label">Market Val</div>
    <div class="stat-value gold" id="marketVal">—</div>
    <div class="stat-sub" id="costBasis">cost —</div>
  </div>
</div>

<div id="alertBanner" style="display:none" class="alert-banner">
  <div class="alert-dot"></div>
  <span id="alertText"></span>
</div>

<div id="app">
  <div class="loading">
    <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--sub)">Loading portfolio</div>
    <div class="loading-bar"></div>
  </div>
</div>

<div class="footer" id="footer" style="display:none">
  PORTFOLIO TRACKER · SWING POSITIONS · DATA VIA YFINANCE
</div>

<script>
const DATA_URL = 'https://fovcuspro.github.io/sp500-swing-scanner/portfolio_results.json';

const fmt = {
  currency: v => {
    const abs = Math.abs(v);
    const sign = v >= 0 ? '+' : '-';
    if (abs >= 1000) return `${sign}$${(abs/1000).toFixed(1)}k`;
    return `${sign}$${abs.toFixed(0)}`;
  },
  price: v => `$${parseFloat(v).toFixed(2)}`,
  pct:   v => `${v >= 0 ? '+' : ''}${parseFloat(v).toFixed(2)}%`,
  rr:    v => v ? `${v}:1` : '—',
  vol:   v => v >= 1e6 ? `${(v/1e6).toFixed(1)}M` : v >= 1e3 ? `${(v/1e3).toFixed(0)}K` : v,
};

function colorClass(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu'; }

function progressPct(entry, current, stop, target) {
  if (!stop || !target) return null;
  const total = target - stop;
  if (total <= 0) return null;
  const filled = current - stop;
  return Math.min(100, Math.max(0, (filled / total) * 100));
}

function renderSummary(summary) {
  const strip = document.getElementById('summaryStrip');
  strip.style.display = 'grid';

  const pnl    = summary.total_unrealised_pnl || 0;
  const pnlPct = summary.total_unrealised_pct || 0;
  const dayPnl = summary.day_pnl || 0;

  const pnlEl = document.getElementById('totalPnl');
  pnlEl.textContent = fmt.currency(pnl);
  pnlEl.className = 'stat-value ' + colorClass(pnl);

  document.getElementById('totalPnlPct').textContent = fmt.pct(pnlPct);
  
  const dayEl = document.getElementById('dayPnl');
  dayEl.textContent = fmt.currency(dayPnl);
  dayEl.className = 'stat-value ' + colorClass(dayPnl);

  document.getElementById('posCount').textContent = `${summary.positions_count || 0} position${summary.positions_count !== 1 ? 's' : ''}`;
  document.getElementById('marketVal').textContent = `$${(summary.total_market_value || 0).toLocaleString('en-US', {maximumFractionDigits:0})}`;
  document.getElementById('costBasis').textContent = `cost $${(summary.total_cost_basis || 0).toLocaleString('en-US', {maximumFractionDigits:0})}`;

  // Alerts
  const alerts = summary.alert_tickers || [];
  if (alerts.length) {
    const banner = document.getElementById('alertBanner');
    banner.style.display = 'flex';
    document.getElementById('alertText').textContent = `Action required: ${alerts.join(', ')}`;
  }
}

function renderCard(pos) {
  const pnl    = pos.unrealised_pnl || 0;
  const pnlPct = pos.unrealised_pct || 0;
  const dayChg = pos.day_change_pct || 0;
  const prog   = progressPct(pos.entry_price, pos.current_price, pos.stop_loss, pos.target);

  const progressHTML = prog !== null ? `
    <div class="progress-section">
      <div class="progress-label">
        <span>Stop ${fmt.price(pos.stop_loss)}</span>
        <span>Entry ${fmt.price(pos.entry_price)}</span>
        <span>Target ${fmt.price(pos.target)}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${prog < 0 ? 'neg-fill' : ''}" style="width:${Math.max(2,prog)}%"></div>
      </div>
      <div class="progress-labels">
        <span>${fmt.pct(pos.pct_to_stop || 0)} away</span>
        <span>${fmt.pct(pos.pct_to_target || 0)} to target</span>
      </div>
    </div>` : '';

  const notesHTML = pos.notes ? `<div class="card-notes">${pos.notes}</div>` : '';

  const rrLabel = pos.risk_reward ? `R:R ${fmt.rr(pos.risk_reward)}` : '';
  const metaParts = [`${pos.shares} shares`, `entry ${fmt.price(pos.entry_price)}`, rrLabel].filter(Boolean);

  return `
  <div class="card signal-${pos.signal}" onclick="this.classList.toggle('expanded')">
    <div class="card-main">
      <div class="signal-dot ${pos.signal}"></div>
      <div class="card-ticker-block">
        <div class="card-ticker">${pos.ticker}</div>
        <div class="card-meta">${metaParts.join(' · ')}</div>
      </div>
      <div class="card-price-block">
        <div class="card-price ${colorClass(pnl)}">${fmt.price(pos.current_price)}</div>
        <div class="card-day-change ${colorClass(dayChg)}">${fmt.pct(dayChg)} today</div>
      </div>
    </div>
    <div class="card-detail">
      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-label">Unrealised P&L</div>
          <div class="detail-value ${colorClass(pnl)}">${fmt.currency(pnl)} (${fmt.pct(pnlPct)})</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Market Value</div>
          <div class="detail-value">$${(pos.market_value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Day Change</div>
          <div class="detail-value ${colorClass(dayChg)}">${fmt.pct(dayChg)} (${fmt.currency(pos.day_change * pos.shares)})</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Volume / Avg</div>
          <div class="detail-value">${fmt.vol(pos.volume)} / ${fmt.vol(pos.avg_volume)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Stop Loss</div>
          <div class="detail-value neg">${pos.stop_loss ? fmt.price(pos.stop_loss) : '—'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Target</div>
          <div class="detail-value pos">${pos.target ? fmt.price(pos.target) : '—'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Cost Basis</div>
          <div class="detail-value">$${(pos.cost_basis||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Risk / Reward</div>
          <div class="detail-value">${fmt.rr(pos.risk_reward)}</div>
        </div>
      </div>
      ${progressHTML}
      <div class="signal-pill pill-${pos.signal}">${pos.signal.replace(/_/g,' ')}</div>
      ${notesHTML}
    </div>
  </div>`;
}

async function load() {
  try {
    const res  = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('scanTime').innerHTML =
      `As of<br>${data.scan_date || '—'}`;

    const positions = data.positions || [];
    const summary   = data.summary   || {};

    if (Object.keys(summary).length) renderSummary(summary);

    const app = document.getElementById('app');
    document.getElementById('footer').style.display = 'block';

    if (!positions.length) {
      app.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <div class="empty-title">No positions yet</div>
          <div class="empty-sub">Add your holdings to <code>portfolio.json</code> and push to GitHub. They'll appear here after the next scan.</div>
        </div>`;
      return;
    }

    // Sort: alerts first, then by abs P&L
    const sorted = [...positions].sort((a,b) => {
      const urgency = ['STOP_HIT','TARGET_HIT','UNDER_PRESSURE','RUNNING','ON_TRACK'];
      const ai = urgency.indexOf(a.signal), bi = urgency.indexOf(b.signal);
      if (ai !== bi) return ai - bi;
      return Math.abs(b.unrealised_pnl) - Math.abs(a.unrealised_pnl);
    });

    app.innerHTML = `
      <div class="section-header">
        <span>Open Positions</span>
        <span class="pos-count">${positions.length}</span>
      </div>
      <div class="positions">
        ${sorted.map(renderCard).join('')}
      </div>`;

  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="error-state">
        <strong>Could not load portfolio data</strong><br><br>
        The tracker runs at 13:00 UTC on weekdays. If markets are closed or the workflow hasn't run yet, data may be from the previous session.<br><br>
        <span style="opacity:0.6">${e.message}</span>
      </div>`;
    document.getElementById('footer').style.display = 'block';
  }
}

load();
</script>
</body>
</html>
