[build]
  publish = "."
  functions = "netlify/functions"
  # Only rebuild when code changes — not on daily JSON data pushes
  ignore = "git diff --quiet HEAD^ HEAD -- index.html portfolio.html manifest.json netlify/ netlify.toml"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
