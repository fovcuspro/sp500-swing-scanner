<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>Swing Scanner</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0a0a0a;
      --surface: #111111;
      --card:    #161616;
      --border:  #242424;
      --muted:   #3a3a3a;
      --text:    #e8e4dc;
      --sub:     #8a8478;
      --gold:    #c9a84c;
      --gold2:   #e8c97a;
      --green:   #4caf7d;
      --red:     #e05555;
      --amber:   #e8a245;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── App header ── */
    .app-header {
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top);
      z-index: 10;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .header-title {
      font-family: 'Instrument Serif', serif;
      font-size: 18px;
      font-style: italic;
      color: var(--gold);
    }
    .header-btns { display: flex; gap: 8px; }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--sub);
      cursor: pointer;
      padding: 7px 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active  { color: var(--gold); border-color: var(--gold); }
    .icon-btn:disabled { opacity: 0.4; }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }

    /* ── Alert banner ── */
    .alert-banner {
      margin: 10px 12px 0;
      background: rgba(224,85,85,0.08);
      border: 1px solid rgba(224,85,85,0.3);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--red);
      display: none;
      align-items: center;
      gap: 8px;
    }
    .alert-dot {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ── Scrollable content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Tab bar ── */
    .tab-bar {
      background: var(--black);
      border-top: 1px solid var(--border);
      display: flex;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sub);
      background: none;
      border: none;
      border-top: 2px solid transparent;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: var(--gold); border-top-color: var(--gold); }
    .tab svg { width: 15px; height: 15px; }

    /* ── Portfolio Hero ── */
    .port-hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px 20px;
    }
    .port-hero-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .port-hero-value {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      font-style: italic;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 10px;
    }
    .port-hero-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .port-hero-sub-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sub);
    }
    .port-hero-pnl {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .port-hero-pnl.pos { color: var(--green); }
    .port-hero-pnl.neg { color: var(--red); }
    .port-hero-cost {
      font-size: 13px;
      color: var(--sub);
    }

    /* ── Investments list header ── */
    .port-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 8px;
    }
    .port-list-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .port-list-title span {
      color: var(--sub);
      font-size: 13px;
      font-weight: 400;
    }
    .sort-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--sub);
      font-size: 14px;
      padding: 4px 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sort-btn:active { color: var(--gold); border-color: var(--gold); }

    /* ── Portfolio list ── */
    .port-list {
      padding: 0 12px 100px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Portfolio item ── */
    .port-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .port-item:active { border-color: var(--gold); }
    .port-item.signal-STOP_HIT    { border-color: rgba(224,85,85,0.5); }
    .port-item.signal-TARGET_HIT  { border-color: rgba(76,175,125,0.5); }
    .port-item.signal-UNDER_PRESSURE { border-color: rgba(232,162,69,0.4); }
    .port-item.signal-RUNNING     { border-left: 3px solid var(--green); }

    .port-item-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }

    /* Avatar circle */
    .port-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--black);
      flex-shrink: 0;
    }

    .port-item-info {
      flex: 1;
      min-width: 0;
    }
    .port-item-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .port-item-sub {
      font-size: 11px;
      color: var(--sub);
      margin-top: 2px;
    }

    .port-item-values {
      text-align: right;
      flex-shrink: 0;
    }
    .port-item-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .port-item-pnl {
      font-size: 11px;
      margin-top: 2px;
    }
    .port-item-pnl.pos { color: var(--green); }
    .port-item-pnl.neg { color: var(--red); }
    .port-item-pnl.neu { color: var(--sub); }

    /* Expanded detail */
    .port-item-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      background: rgba(255,255,255,0.015);
    }
    .port-item.open .port-item-detail { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }
    .detail-label {
      font-size: 9px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .detail-value { font-size: 13px; color: var(--text); }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--sub); }

    .progress-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 9px; color: var(--sub); margin-bottom: 8px;
    }
    .progress-track { height: 4px; background: var(--muted); border-radius: 2px; margin-bottom: 6px; }
    .progress-fill  { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--green)); transition: width 0.4s; }
    .progress-fill.neg-fill { background: linear-gradient(90deg, var(--red), var(--amber)); }
    .progress-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--sub); }

    .signal-pill {
      display: inline-block;
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 3px 8px; border-radius: 4px; margin-top: 10px;
    }
    .pill-STOP_HIT       { background: rgba(224,85,85,0.15); color: var(--red);   border: 1px solid rgba(224,85,85,0.3); }
    .pill-TARGET_HIT     { background: rgba(76,175,125,0.15); color: var(--green); border: 1px solid rgba(76,175,125,0.3); }
    .pill-UNDER_PRESSURE { background: rgba(232,162,69,0.15); color: var(--amber); border: 1px solid rgba(232,162,69,0.3); }
    .pill-RUNNING        { background: rgba(76,175,125,0.1);  color: var(--green); border: 1px solid rgba(76,175,125,0.2); }
    .pill-ON_TRACK       { background: rgba(138,132,120,0.1); color: var(--sub);   border: 1px solid var(--border); }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-edit {
      padding: 10px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 8px;
      color: var(--gold);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-remove {
      padding: 10px;
      background: rgba(224,85,85,0.08);
      border: 1px solid rgba(224,85,85,0.2);
      border-radius: 8px;
      color: var(--red);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Scanner cards ── */
    .cards { padding: 8px 12px 24px; display: flex; flex-direction: column; gap: 8px; }

    .scanner-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .scanner-card:active { border-color: var(--gold); }

    .scanner-card .card-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      background: rgba(255,255,255,0.015);
    }
    .scanner-card.open .card-detail { display: block; }

    .scanner-card .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
    }
    .rank { font-size: 11px; color: var(--muted); min-width: 20px; }

    .scanner-ticker-block { flex: 1; min-width: 0; }
    .scanner-ticker {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .scanner-name {
      font-size: 10px;
      color: var(--sub);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scanner-right { text-align: right; flex-shrink: 0; }
    .score-display {
      font-size: 15px;
      font-weight: 500;
      color: var(--gold);
    }
    .score-display span {
      font-size: 11px;
      color: var(--sub);
      font-weight: 400;
    }
    .scanner-price {
      font-size: 11px;
      color: var(--sub);
      margin-top: 2px;
    }
    .chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; flex-shrink: 0; margin-left: 6px; }
    .scanner-card.open .chevron { transform: rotate(180deg); }

    .score-breakdown {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .score-pill {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(201,168,76,0.1);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.25);
    }
    .reasoning {
      margin-top: 10px;
      font-size: 11px;
      color: var(--sub);
      line-height: 1.6;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: calc(68px + env(safe-area-inset-bottom));
      right: 18px;
      width: 52px; height: 52px;
      background: var(--gold); color: var(--black);
      border: none; border-radius: 50%;
      font-size: 28px; font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .fab:active { transform: scale(0.9); }

    /* ── Sheet ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 0 20px calc(28px + env(safe-area-inset-bottom));
      z-index: 400;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      max-height: 85vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; background: var(--muted);
      border-radius: 2px; margin: 12px auto 20px;
    }
    .sheet-title {
      font-family: 'Instrument Serif', serif;
      font-size: 20px; font-style: italic; color: var(--gold); margin-bottom: 20px;
    }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--sub); margin-bottom: 6px;
    }
    .form-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace;
      font-size: 15px; padding: 11px 13px; outline: none;
      transition: border-color 0.15s; -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--gold); }
    .form-input::placeholder { color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-primary {
      width: 100%; background: var(--gold); color: var(--black);
      border: none; border-radius: 10px; padding: 14px;
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      margin-top: 6px; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s;
    }
    .btn-primary:active   { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .form-error { font-size: 11px; color: var(--red); margin-top: 8px; min-height: 16px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; letter-spacing: 0.03em;
      padding: 10px 18px; border-radius: 8px; white-space: nowrap;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      z-index: 500; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-error { color: var(--red); border-color: rgba(224,85,85,0.3); }

    /* ── States ── */
    .loading {
      text-align: center; padding: 80px 20px;
      color: var(--sub); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .loading-bar {
      width: 120px; height: 2px; background: var(--border);
      margin: 16px auto 0; border-radius: 1px; overflow: hidden;
    }
    .loading-bar::after {
      content: ''; display: block; height: 100%; width: 40%;
      background: var(--gold); border-radius: 1px;
      animation: slide 1s ease-in-out infinite;
    }
    .empty-state { text-align: center; padding: 60px 30px; color: var(--sub); }
    .empty-title {
      font-family: 'Instrument Serif', serif;
      font-size: 20px; font-style: italic; color: var(--text); margin-bottom: 8px;
    }
    .empty-sub { font-size: 11px; line-height: 1.6; }
    .error-state {
      margin: 20px 14px; padding: 14px;
      background: rgba(224,85,85,0.06); border: 1px solid rgba(224,85,85,0.2);
      border-radius: 8px; color: var(--red); font-size: 12px; line-height: 1.6;
    }
    .scan-meta { font-size: 10px; color: var(--sub); padding: 10px 14px 4px; letter-spacing: 0.04em; }

    /* ── Animations ── */
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.8); } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .port-item { opacity: 0; transform: translateY(8px); animation: fadeUp 0.3s ease forwards; }
    .port-list .port-item:nth-child(1) { animation-delay: 0.03s; }
    .port-list .port-item:nth-child(2) { animation-delay: 0.07s; }
    .port-list .port-item:nth-child(3) { animation-delay: 0.11s; }
    .port-list .port-item:nth-child(4) { animation-delay: 0.15s; }
    .port-list .port-item:nth-child(5) { animation-delay: 0.19s; }
    .port-list .port-item:nth-child(6) { animation-delay: 0.23s; }
    .port-list .port-item:nth-child(n+7) { animation-delay: 0.27s; }

    .scanner-card { opacity: 0; transform: translateY(8px); animation: fadeUp 0.3s ease forwards; }
    .cards .scanner-card:nth-child(1) { animation-delay: 0.03s; }
    .cards .scanner-card:nth-child(2) { animation-delay: 0.06s; }
    .cards .scanner-card:nth-child(3) { animation-delay: 0.09s; }
    .cards .scanner-card:nth-child(4) { animation-delay: 0.12s; }
    .cards .scanner-card:nth-child(5) { animation-delay: 0.15s; }
    .cards .scanner-card:nth-child(6) { animation-delay: 0.18s; }
    .cards .scanner-card:nth-child(n+7) { animation-delay: 0.21s; }

    /* ── Performance tab ───────────────────────────────────────── */
    .perf-hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px 20px;
    }
    .perf-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      font-style: italic;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .stat-value.pos { color: var(--green); }
    .stat-value.neg { color: var(--red); }
    .stat-sub {
      font-size: 10px;
      color: var(--sub);
      margin-top: 5px;
    }

    .breakdown-section {
      padding: 16px 16px 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }
    .breakdown-section:last-child { border-bottom: none; }
    .breakdown-title {
      font-size: 10px;
      font-weight: 500;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }
    .breakdown-header, .breakdown-row {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.2fr 1.5fr;
      gap: 4px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .breakdown-header {
      font-size: 9px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .breakdown-row { font-size: 13px; }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-col { color: var(--text); }
    .breakdown-col.right { text-align: right; color: var(--sub); }
    .breakdown-row .breakdown-col.right { color: var(--text); }
    .breakdown-row .breakdown-col.pos   { color: var(--green); text-align: right; }
    .breakdown-row .breakdown-col.neg   { color: var(--red);   text-align: right; }
    .breakdown-row .breakdown-col.neu   { color: var(--sub);   text-align: right; }

    .highlight-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .highlight-item:last-child { border-bottom: none; }
    .hl-label { font-size: 11px; color: var(--sub); flex-shrink: 0; }
    .hl-val   { font-size: 12px; color: var(--text); text-align: right; }
    .hl-val.pos { color: var(--green); }
    .hl-val.neg { color: var(--red); }

    .trade-history-list { display: flex; flex-direction: column; }
    .trade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .trade-item:last-child { border-bottom: none; }
    .trade-ticker { font-size: 14px; font-weight: 500; color: var(--text); }
    .trade-name   { font-size: 10px; color: var(--sub); margin-top: 1px;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .trade-meta   { font-size: 10px; color: var(--sub); margin-top: 2px; }
    .trade-item-right { text-align: right; flex-shrink: 0; }
    .trade-return { font-size: 13px; font-weight: 500; }
    .trade-return.pos { color: var(--green); }
    .trade-return.neg { color: var(--red); }
    .trade-return.neu { color: var(--sub); }
    .trade-status {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub);
      margin-top: 3px;
    }
    .trade-status.status-target_hit { color: var(--green); }
    .trade-status.status-stop_hit   { color: var(--red); }
    .trade-status.status-expired    { color: var(--sub); }

    /* ── Signal Log tab ── */
    .log-list { display: flex; flex-direction: column; padding: 8px 12px 100px; gap: 0; }
    .log-item {
      border-bottom: 1px solid var(--border);
      padding: 12px 4px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .log-item:last-child { border-bottom: none; }
    .log-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-top: 5px;
    }
    .log-dot.open    { background: var(--gold); }
    .log-dot.target  { background: var(--green); }
    .log-dot.stop    { background: var(--red); }
    .log-dot.expired { background: var(--muted); }
    .log-body { flex: 1; min-width: 0; }
    .log-row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .log-ticker { font-size: 14px; font-weight: 500; color: var(--text); }
    .log-company { font-size: 10px; color: var(--sub); margin-top: 2px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-date { font-size: 10px; color: var(--sub); flex-shrink: 0; }
    .log-prices {
      display: flex; gap: 16px; margin-top: 7px; flex-wrap: wrap;
    }
    .lp { display: flex; flex-direction: column; gap: 2px; }
    .lp-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sub); }
    .lp-val   { font-size: 12px; color: var(--text); }
    .lp-buy  .lp-val { color: var(--gold); }
    .lp-stop .lp-val { color: var(--red); }
    .lp-tgt  .lp-val { color: var(--green); }
  </style>
</head>

<div class="toast" id="toast"></div>

<script>
'use strict';

const SCANNER_URL     = 'https://fovcuspro.github.io/sp500-swing-scanner/results.json';
const PORTFOLIO_URL   = 'https://fovcuspro.github.io/sp500-swing-scanner/portfolio_results.json';
const ANALYTICS_URL   = 'https://fovcuspro.github.io/sp500-swing-scanner/analytics.json';
const HISTORY_URL     = 'https://fovcuspro.github.io/sp500-swing-scanner/trade_history.json';

let activeTab     = 'scanner';
let scannerData   = null;
let portfolioData = null;
let analyticsData = null;
let historyData   = null;
let editTicker    = null;
let sortMode      = 'signal'; // 'signal' | 'value' | 'pnl'

// ── GitHub API (direct, token stored in localStorage) ─────────────────────────
const REPO = 'fovcuspro/sp500-swing-scanner';
const TOKEN_KEY = 'gh_pat';

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

function ghHeaders() {
  return {
    Authorization: `token ${getToken()}`,
    Accept: 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
}

async function api(action, params = {}) {
  const token = getToken();
  if (!token) {
    promptToken();
    throw new Error('GitHub token required — enter it in the prompt');
  }
  const gh = ghHeaders();

  if (action === 'run') {
    const body = JSON.stringify({ ref: 'main' });
    const [r1, r2] = await Promise.all([
      fetch(`https://api.github.com/repos/${REPO}/actions/workflows/daily_scan.yml/dispatches`,      { method: 'POST', headers: gh, body }),
      fetch(`https://api.github.com/repos/${REPO}/actions/workflows/daily_portfolio.yml/dispatches`, { method: 'POST', headers: gh, body }),
    ]);
    if (r1.status !== 204 || r2.status !== 204) {
      const err = await (r1.status !== 204 ? r1 : r2).json().catch(() => ({}));
      throw new Error(err.message || 'Failed to trigger workflows');
    }
    return { ok: true };
  }

  if (action === 'get_portfolio') {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/portfolio.json`, { headers: gh });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || `GitHub ${r.status}`); }
    const data = await r.json();
    const positions = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
    return { positions, sha: data.sha };
  }

  if (action === 'save_portfolio') {
    const { positions, sha, message } = params;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(positions, null, 2) + '\n')));
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/portfolio.json`, {
      method: 'PUT', headers: gh,
      body: JSON.stringify({ message: message || 'portfolio: update', content, sha }),
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || `GitHub ${r.status}`); }
    return { ok: true };
  }

  throw new Error(`Unknown action: ${action}`);
}

function promptToken() {
  const existing = getToken();
  const t = window.prompt(
    'Enter your GitHub Personal Access Token\n(needs: Actions write + Contents write for this repo)',
    existing
  );
  if (t && t.trim()) {
    localStorage.setItem(TOKEN_KEY, t.trim());
    showToast('Token saved');
  }
}

// ── Avatar ─────────────────────────────────────────────────────────────────────
function avatarColor(ticker) {
  const palette = ['#c9a84c','#4caf7d','#5b8def','#e8a245','#a07aff','#e05555','#48c4c4','#f06292'];
  let h = 0;
  for (const c of ticker) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return palette[h % palette.length];
}

function avatarInitials(ticker, name) {
  if (name && name !== ticker) {
    const words = name.replace(/[^a-zA-Z ]/g, '').split(' ').filter(w => w.length > 1);
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
  }
  return ticker.replace(/[^A-Z]/g, '').substring(0, 2);
}

// ── Tab management ─────────────────────────────────────────────────────────────
function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === t)
  );
  const fab = document.getElementById('fab');
  fab.style.display = t === 'portfolio' ? 'flex' : 'none';

  const banner = document.getElementById('alertBanner');
  if (t === 'scanner') {
    banner.style.display = 'none';
    document.getElementById('headerTitle').innerHTML =
      'SP500 <span style="color:var(--gold2)">Scanner</span>';
    if (scannerData) renderScanner(); else fetchScanner();
  } else if (t === 'portfolio') {
    document.getElementById('headerTitle').textContent = 'Portfolio';
    if (portfolioData) renderPortfolio(); else fetchPortfolio();
  } else if (t === 'performance') {
    banner.style.display = 'none';
    document.getElementById('headerTitle').textContent = 'Performance';
    if (analyticsData) renderPerformance(); else fetchAnalytics();
  } else {
    banner.style.display = 'none';
    document.getElementById('headerTitle').textContent = 'Signal Log';
    if (historyData) renderHistory(); else fetchHistory();
  }
}

// ── Data fetching ──────────────────────────────────────────────────────────────
async function fetchScanner() {
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="loading-bar"></div><p style="margin-top:14px">Loading scanner…</p></div>';
  try {
    const r = await fetch(SCANNER_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    scannerData = await r.json();
    renderScanner();
  } catch(e) {
    showError('Could not load scan results.<br>' + e.message);
  }
}

async function fetchPortfolio() {
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="loading-bar"></div><p style="margin-top:14px">Loading portfolio…</p></div>';
  try {
    const r = await fetch(PORTFOLIO_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    portfolioData = await r.json();

    // Fetch raw portfolio.json to surface positions not yet processed by workflow
    try {
      const { positions: raw } = await api('get_portfolio');
      const shown = new Set((portfolioData.positions || []).map(p => p.ticker.toUpperCase()));
      for (const h of raw) {
        if (!shown.has(h.ticker.toUpperCase())) {
          injectPendingPosition({
            ticker:      h.ticker.toUpperCase(),
            shares:      h.shares,
            entry_price: h.entry_price,
            stop_loss:   h.stop_loss  || null,
            target:      h.target     || null,
          });
        }
      }
    } catch(_) { /* silent — raw fetch failing doesn't break the portfolio view */ }

    renderPortfolio();
  } catch(e) {
    showError('Could not load portfolio data.<br>' + e.message);
  }
}

// Inject a position into portfolioData as a pending placeholder (no live price yet).
// Returns true if the position was newly added, false if it was already displayed.
function injectPendingPosition({ ticker, shares, entry_price, stop_loss, target }) {
  if (!portfolioData) portfolioData = { scan_date: '', summary: {}, positions: [] };

  const alreadyShown = portfolioData.positions.some(
    p => p.ticker.toUpperCase() === ticker.toUpperCase()
  );
  if (alreadyShown) return false;

  const mktVal = shares * entry_price;
  portfolioData.positions.push({
    ticker,
    company_name:   ticker,
    shares,
    entry_price,
    current_price:  entry_price,
    stop_loss:      stop_loss || null,
    target:         target    || null,
    cost_basis:     mktVal,
    market_value:   mktVal,
    unrealised_pnl: 0,
    unrealised_pct: 0,
    day_change:     0,
    day_change_pct: 0,
    volume:         0,
    avg_volume:     0,
    pct_to_stop:    null,
    pct_to_target:  null,
    risk_reward:    null,
    signal:         'ON_TRACK',
    _pending:       true,
  });

  // Recalculate summary totals
  const allPos     = portfolioData.positions;
  const totalCost  = allPos.reduce((s, p) => s + (p.cost_basis  || 0), 0);
  const totalVal   = allPos.reduce((s, p) => s + (p.market_value || 0), 0);
  const totalPnl   = totalVal - totalCost;
  portfolioData.summary = {
    ...portfolioData.summary,
    total_cost_basis:      totalCost,
    total_market_value:    totalVal,
    total_unrealised_pnl:  totalPnl,
    total_unrealised_pct:  totalCost ? (totalPnl / totalCost * 100) : 0,
    positions_count:       allPos.length,
    day_pnl:               portfolioData.summary?.day_pnl || 0,
    alert_tickers:         portfolioData.summary?.alert_tickers || [],
  };
  return true;
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    if      (activeTab === 'scanner')     { scannerData   = null; await fetchScanner(); }
    else if (activeTab === 'portfolio')   { portfolioData = null; await fetchPortfolio(); }
    else if (activeTab === 'performance') { analyticsData = null; await fetchAnalytics(); }
    else                                  { historyData   = null; await fetchHistory(); }
  } finally {
    btn.classList.remove('spinning');
  }
}

// ── Scanner rendering ──────────────────────────────────────────────────────────
function renderScanner() {
  const main   = document.getElementById('main');
  const setups = scannerData?.top_setups || [];
  const date   = scannerData?.scan_date  || '—';
  const found  = scannerData?.candidates_found ?? 0;
  const time   = scannerData?.scan_time_utc ? ` · ${scannerData.scan_time_utc} UTC` : '';

  if (!setups.length) {
    main.innerHTML = `
      <div class="scan-meta">${date}${time} · ${found} candidates</div>
      <div class="empty-state">
        <div class="empty-title">No setups today</div>
        <div class="empty-sub">No stocks passed all filters. Try again tomorrow or tap ▶ to run a fresh scan.</div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="scan-meta">${date}${time} · ${found} candidates · ${setups.length} setups</div>
    <div class="cards">${setups.map((s, i) => scannerCard(s, i + 1)).join('')}</div>`;

  main.querySelectorAll('.scanner-card').forEach(c =>
    c.addEventListener('click', () => c.classList.toggle('open'))
  );
}

function scannerCard(s, rank) {
  const f   = (n, dp = 2) => Number(n).toFixed(dp);
  const ind = s.indicators     || {};
  const ez  = s.entry_zone     || {};
  const sb  = s.score_breakdown || {};
  const name = s.company_name && s.company_name !== s.ticker ? s.company_name : '';

  const tScore = Number(sb.trend_strength   || 0).toFixed(1);
  const pScore = Number(sb.pullback_quality || 0).toFixed(1);
  const vScore = Number(sb.volume_confirm   || 0).toFixed(1);
  const total  = Number(s.score || 0).toFixed(1);

  return `
  <div class="card scanner-card">
    <div class="card-header">
      <span class="rank">#${rank}</span>
      <div class="scanner-ticker-block">
        <div class="scanner-ticker">${s.ticker}</div>
        ${name ? `<div class="scanner-name">${name}</div>` : ''}
      </div>
      <div class="scanner-right">
        <div class="score-display">${total}<span> / 10</span></div>
        <div class="scanner-price">$${f(s.price)}</div>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-detail">
      <div class="score-breakdown">
        <span class="score-pill">Trend ${tScore}/10</span>
        <span class="score-pill">Pullback ${pScore}/10</span>
        <span class="score-pill">Volume ${vScore}/10</span>
      </div>
      <div class="detail-grid" style="margin-top:12px">
        <div><div class="detail-label">Entry zone</div><div class="detail-value">$${f(ez.low)} – $${f(ez.high)}</div></div>
        <div><div class="detail-label">Risk / Reward</div><div class="detail-value ${s.risk_reward >= 2 ? 'pos' : ''}">${f(s.risk_reward)}×</div></div>
        <div><div class="detail-label">Stop loss</div><div class="detail-value neg">$${f(s.stop_loss)}</div></div>
        <div><div class="detail-label">Target</div><div class="detail-value pos">$${f(s.target)}</div></div>
        <div><div class="detail-label">RSI (14)</div><div class="detail-value">${f(ind.rsi, 1)}</div></div>
        <div><div class="detail-label">Pullback</div><div class="detail-value">${f(ind.pullback_pct, 1)}%</div></div>
        <div><div class="detail-label">50 MA</div><div class="detail-value">$${f(ind.ma50)}</div></div>
        <div><div class="detail-label">200 MA</div><div class="detail-value">$${f(ind.ma200)}</div></div>
        <div><div class="detail-label">Volume ratio</div><div class="detail-value">${f(ind.volume_ratio)}×</div></div>
      </div>
      <div class="reasoning">${s.reasoning || ''}</div>
    </div>
  </div>`;
}

// ── Portfolio rendering ────────────────────────────────────────────────────────
function renderPortfolio() {
  const positions = portfolioData?.positions || [];
  const summary   = portfolioData?.summary   || {};
  const date      = portfolioData?.scan_date || '';

  // Alerts
  const banner = document.getElementById('alertBanner');
  const alerts = summary.alert_tickers || [];
  if (alerts.length) {
    banner.style.display = 'flex';
    document.getElementById('alertText').textContent = `Action required: ${alerts.join(', ')}`;
  } else {
    banner.style.display = 'none';
  }

  const main = document.getElementById('main');

  if (!positions.length) {
    main.innerHTML = `
      <div class="empty-state" style="margin-top:40px">
        <div class="empty-title">No positions</div>
        <div class="empty-sub">Tap + to add your first position, then tap ▶ to fetch prices.</div>
      </div>`;
    return;
  }

  const totalValue = summary.total_market_value || 0;
  const totalCost  = summary.total_cost_basis   || 0;
  const totalPnl   = summary.total_unrealised_pnl || 0;
  const totalPnlPct = summary.total_unrealised_pct || 0;
  const dayPnl     = summary.day_pnl || 0;
  const count      = positions.length;

  const cc = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
  const cur = (v, showSign = true) => {
    const abs = Math.abs(v), sign = showSign ? (v >= 0 ? '+' : '-') : '';
    return `${sign}$${abs.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
  };
  const pct = v => `${v >= 0 ? '+' : ''}${Number(v).toFixed(2)}%`;

  const sorted = sortPositions(positions);

  main.innerHTML = `
    <div class="port-hero">
      <div class="port-hero-label">Portfolio Value</div>
      <div class="port-hero-value">${cur(totalValue, false)}</div>
      <div class="port-hero-row">
        <div class="port-hero-sub-label">Unrealised</div>
        <div class="port-hero-pnl ${cc(totalPnl)}">${cur(totalPnl)} (${pct(totalPnlPct)})</div>
      </div>
      <div class="port-hero-row" style="margin-top:4px">
        <div class="port-hero-sub-label">Day P&L</div>
        <div class="port-hero-pnl ${cc(dayPnl)}">${cur(dayPnl)}</div>
      </div>
      <div class="port-hero-row" style="margin-top:4px">
        <div class="port-hero-sub-label">Cost basis</div>
        <div class="port-hero-cost">${cur(totalCost, false)}</div>
      </div>
    </div>
    <div class="port-list-header">
      <div class="port-list-title">Investments <span>· ${count}</span></div>
      <button class="sort-btn" onclick="cycleSort()" title="Sort">↕</button>
    </div>
    ${date ? `<div class="scan-meta" style="padding-top:0;padding-bottom:8px">As of ${date}</div>` : ''}
    <div class="port-list">
      ${sorted.map(p => portfolioItem(p, totalValue)).join('')}
    </div>`;

  main.querySelectorAll('.port-item').forEach(el =>
    el.addEventListener('click', () => el.classList.toggle('open'))
  );
}

function sortPositions(positions) {
  const order = ['STOP_HIT','TARGET_HIT','UNDER_PRESSURE','RUNNING','ON_TRACK'];
  const arr = [...positions];
  if (sortMode === 'value') {
    arr.sort((a, b) => (b.market_value || 0) - (a.market_value || 0));
  } else if (sortMode === 'pnl') {
    arr.sort((a, b) => (b.unrealised_pnl || 0) - (a.unrealised_pnl || 0));
  } else {
    arr.sort((a, b) => {
      const d = order.indexOf(a.signal) - order.indexOf(b.signal);
      return d !== 0 ? d : Math.abs(b.unrealised_pnl) - Math.abs(a.unrealised_pnl);
    });
  }
  return arr;
}

function cycleSort() {
  const modes = ['signal', 'value', 'pnl'];
  sortMode = modes[(modes.indexOf(sortMode) + 1) % modes.length];
  const labels = { signal: 'Sorted by status', value: 'Sorted by value', pnl: 'Sorted by P&L' };
  showToast(labels[sortMode]);
  if (portfolioData) renderPortfolio();
}

function portfolioItem(pos, totalValue) {
  const pnl     = pos.unrealised_pnl || 0;
  const pnlPct  = pos.unrealised_pct || 0;
  const dayChg  = pos.day_change_pct || 0;
  const mktVal  = pos.market_value   || 0;
  const alloc   = totalValue > 0 ? ((mktVal / totalValue) * 100).toFixed(1) : '0.0';
  const name    = pos.company_name || pos.ticker;
  const initials = avatarInitials(pos.ticker, pos.company_name);
  const color    = avatarColor(pos.ticker);

  const cc  = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
  const p   = v => `$${parseFloat(v).toFixed(2)}`;
  const pct = v => `${v >= 0 ? '+' : ''}${parseFloat(v).toFixed(2)}%`;
  const cur = v => {
    const abs = Math.abs(v), sign = v >= 0 ? '+' : '-';
    return abs >= 1000
      ? `${sign}$${(abs/1000).toFixed(2)}k`
      : `${sign}$${abs.toFixed(2)}`;
  };

  let progressHTML = '';
  if (pos.stop_loss && pos.target) {
    const total  = pos.target - pos.stop_loss;
    const filled = total > 0
      ? Math.min(100, Math.max(0, ((pos.current_price - pos.stop_loss) / total) * 100))
      : 0;
    const isNeg  = filled < 25;
    progressHTML = `
      <div class="progress-section">
        <div class="progress-label">
          <span>Stop ${p(pos.stop_loss)}</span>
          <span>Entry ${p(pos.entry_price)}</span>
          <span>Target ${p(pos.target)}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill ${isNeg ? 'neg-fill' : ''}" style="width:${Math.max(2,filled)}%"></div>
        </div>
        <div class="progress-labels">
          <span>${pct(pos.pct_to_stop || 0)} from stop</span>
          <span>${pct(pos.pct_to_target || 0)} to target</span>
        </div>
      </div>`;
  }

  const pendingBadge = pos._pending
    ? `<div style="font-size:9px;color:var(--amber);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px">Pending prices</div>`
    : '';

  return `
  <div class="port-item signal-${pos.signal}">
    <div class="port-item-main">
      <div class="port-avatar" style="background:${color};${pos._pending ? 'opacity:0.6' : ''}">${initials}</div>
      <div class="port-item-info">
        <div class="port-item-name">${name}</div>
        <div class="port-item-sub">${pos.ticker} · ${alloc}%</div>
        ${pendingBadge}
      </div>
      <div class="port-item-values">
        <div class="port-item-value">${pos._pending ? '—' : p(pos.current_price)}</div>
        <div class="port-item-pnl ${pos._pending ? 'neu' : cc(dayChg)}">${pos._pending ? 'tap ▶ to load' : pct(dayChg) + ' today'}</div>
      </div>
    </div>
    <div class="port-item-detail">
      <div class="detail-grid">
        <div><div class="detail-label">Shares</div><div class="detail-value">${pos.shares}</div></div>
        <div><div class="detail-label">Entry Price</div><div class="detail-value">${p(pos.entry_price)}</div></div>
        <div><div class="detail-label">Current Price</div><div class="detail-value">${p(pos.current_price)}</div></div>
        <div><div class="detail-label">Day Change</div><div class="detail-value ${cc(dayChg)}">${pct(dayChg)}</div></div>
        <div><div class="detail-label">Stop Loss</div><div class="detail-value neg">${pos.stop_loss ? p(pos.stop_loss) : '—'}</div></div>
        <div><div class="detail-label">Target</div><div class="detail-value pos">${pos.target ? p(pos.target) : '—'}</div></div>
        <div><div class="detail-label">Cost Basis</div><div class="detail-value">$${(pos.cost_basis||0).toFixed(2)}</div></div>
        <div><div class="detail-label">Risk / Reward</div><div class="detail-value">${pos.risk_reward ? pos.risk_reward + ':1' : '—'}</div></div>
      </div>
      ${progressHTML}
      <div class="signal-pill pill-${pos.signal}">${pos.signal.replace(/_/g,' ')}</div>
      <div class="detail-actions">
        <button class="btn-edit" onclick="event.stopPropagation(); openEditSheet('${pos.ticker}')">Edit</button>
        <button class="btn-remove" onclick="event.stopPropagation(); removePosition('${pos.ticker}')">Remove</button>
      </div>
    </div>
  </div>`;
}

async function fetchHistory() {
  document.getElementById('main').innerHTML =
    '<div class="loading"><div class="loading-bar"></div><p style="margin-top:14px">Loading signal log…</p></div>';
  try {
    const r = await fetch(HISTORY_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    historyData = await r.json();
    renderHistory();
  } catch(e) {
    showError('Could not load signal log.<br>' + e.message);
  }
}

function renderHistory() {
  const main   = document.getElementById('main');
  const trades = (historyData || []).slice().reverse();

  if (!trades.length) {
    main.innerHTML = `
      <div class="empty-state" style="margin-top:40px">
        <div class="empty-title">No signals yet</div>
        <div class="empty-sub">Every scanner signal will be permanently recorded here.<br>Signals appear after the first daily scan runs.</div>
      </div>`;
    return;
  }

  const f = n => n != null ? `$${parseFloat(n).toFixed(2)}` : '—';
  const fmtDate = s => {
    const [y, m, d] = s.split('-');
    const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${parseInt(d)} ${mon[parseInt(m)-1]} ${y}`;
  };
  const dotCls = status => {
    if (status === 'target_hit') return 'target';
    if (status === 'stop_hit')   return 'stop';
    if (status === 'expired')    return 'expired';
    return 'open';
  };

  const items = trades.map(t => {
    const name = t.company_name && t.company_name !== t.ticker ? t.company_name : '';
    return `
    <div class="log-item">
      <div class="log-dot ${dotCls(t.status)}"></div>
      <div class="log-body">
        <div class="log-row1">
          <div style="display:flex;align-items:baseline;gap:7px">
            <span class="log-ticker">${t.ticker}</span>
            ${t.score != null ? `<span style="font-size:10px;color:var(--gold);font-weight:500">${parseFloat(t.score).toFixed(1)}<span style="color:var(--sub)">/10</span></span>` : ''}
          </div>
          <div class="log-date">${fmtDate(t.date_generated)}</div>
        </div>
        ${name ? `<div class="log-company">${name}</div>` : ''}
        <div class="log-prices">
          <div class="lp lp-buy"><div class="lp-label">Buy</div><div class="lp-val">${f(t.entry_price)}</div></div>
          <div class="lp lp-stop"><div class="lp-label">Stop</div><div class="lp-val">${f(t.stop_loss)}</div></div>
          <div class="lp lp-tgt"><div class="lp-label">Target</div><div class="lp-val">${f(t.target)}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div style="padding:10px 16px 6px;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.08em">
      ${trades.length} signal${trades.length !== 1 ? 's' : ''} recorded
    </div>
    <div class="log-list">${items}</div>`;
}

function openAddSheet() {
  document.getElementById('addScreen').style.display = 'block';
  document.getElementById('editScreen').style.display = 'none';
  document.getElementById('addError').textContent = '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('fTicker').focus(), 320);
}

function openEditSheet(ticker) {
  const pos = (portfolioData?.positions || []).find(p => p.ticker === ticker);
  if (!pos) return;
  editTicker = ticker;
  document.getElementById('editTitle').textContent = `Edit ${ticker}`;
  document.getElementById('eShares').value = pos.shares;
  document.getElementById('eEntry').value  = pos.entry_price;
  document.getElementById('eStop').value   = pos.stop_loss  || '';
  document.getElementById('eTarget').value = pos.target     || '';
  document.getElementById('editError').textContent = '';
  document.getElementById('addScreen').style.display  = 'none';
  document.getElementById('editScreen').style.display = 'block';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('eShares').focus(), 320);
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function submitPosition() {
  const ticker = document.getElementById('fTicker').value.trim().toUpperCase();
  const shares = parseFloat(document.getElementById('fShares').value);
  const entry  = parseFloat(document.getElementById('fEntry').value);
  const stop   = parseFloat(document.getElementById('fStop').value)   || null;
  const target = parseFloat(document.getElementById('fTarget').value) || null;
  const errEl  = document.getElementById('addError');
  const btn    = document.getElementById('addBtn');

  errEl.textContent = '';
  if (!ticker)                { errEl.textContent = 'Ticker is required.'; return; }
  if (!shares || shares <= 0) { errEl.textContent = 'Shares must be > 0.'; return; }
  if (!entry  || entry  <= 0) { errEl.textContent = 'Entry price must be > 0.'; return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const { positions, sha } = await api('get_portfolio');
    if (positions.some(p => p.ticker.toUpperCase() === ticker)) {
      // Already in portfolio.json — show it in the list if it's missing from the display
      const shown = injectPendingPosition({ ticker, shares, entry_price: entry,
        stop_loss: stop || null, target: target || null });
      if (shown) {
        ['fTicker','fShares','fEntry','fStop','fTarget'].forEach(id =>
          document.getElementById(id).value = '');
        closeSheet();
        if (activeTab === 'portfolio') renderPortfolio();
        showToast(`${ticker} was already saved — showing now`);
      } else {
        errEl.textContent = `${ticker} is already in your portfolio.`;
      }
      return;
    }
    const pos = { ticker, shares, entry_price: entry };
    if (stop)   pos.stop_loss = stop;
    if (target) pos.target    = target;
    positions.push(pos);
    await api('save_portfolio', { positions, sha, message: `portfolio: add ${ticker}` });
    ['fTicker','fShares','fEntry','fStop','fTarget'].forEach(id =>
      document.getElementById(id).value = '');

    injectPendingPosition({ ticker, shares, entry_price: entry,
      stop_loss: stop || null, target: target || null });

    closeSheet();
    if (activeTab === 'portfolio') renderPortfolio();
    showToast(`${ticker} added — tap ▶ to fetch prices`);
  } catch(e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Add Position';
  }
}

async function saveEdit() {
  const shares = parseFloat(document.getElementById('eShares').value);
  const entry  = parseFloat(document.getElementById('eEntry').value);
  const stop   = parseFloat(document.getElementById('eStop').value)   || null;
  const target = parseFloat(document.getElementById('eTarget').value) || null;
  const errEl  = document.getElementById('editError');
  const btn    = document.getElementById('editBtn');

  errEl.textContent = '';
  if (!shares || shares <= 0) { errEl.textContent = 'Shares must be > 0.'; return; }
  if (!entry  || entry  <= 0) { errEl.textContent = 'Entry price must be > 0.'; return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const { positions, sha } = await api('get_portfolio');
    const updated = positions.map(p => {
      if (p.ticker.toUpperCase() !== editTicker.toUpperCase()) return p;
      const next = { ...p, shares, entry_price: entry };
      if (stop)   next.stop_loss = stop; else delete next.stop_loss;
      if (target) next.target    = target; else delete next.target;
      return next;
    });
    await api('save_portfolio', { positions: updated, sha, message: `portfolio: update ${editTicker}` });
    closeSheet();
    showToast(`${editTicker} updated — tap ▶ to refresh prices`);
  } catch(e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}

async function removePosition(ticker) {
  if (!confirm(`Remove ${ticker} from your portfolio?`)) return;
  try {
    const { positions, sha } = await api('get_portfolio');
    const updated = positions.filter(p => p.ticker.toUpperCase() !== ticker.toUpperCase());
    await api('save_portfolio', { positions: updated, sha, message: `portfolio: remove ${ticker}` });
    for (const el of document.querySelectorAll('.port-item')) {
      const sub = el.querySelector('.port-item-sub');
      if (sub && sub.textContent.startsWith(ticker + ' ·')) { el.remove(); break; }
    }
    showToast(`${ticker} removed`);
  } catch(e) {
    showToast(e.message, true);
  }
}

// ── Utilities ──────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show' + (isError ? ' toast-error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
function showError(msg) {
  document.getElementById('main').innerHTML =
    `<div class="error-state"><strong>Could not load data</strong><br><br>${msg}</div>`;
}

setTab('scanner');
</script>
</body>
</html>
